name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    # 不用 ubuntu-latest：它已经指向 Ubuntu 26.04，
    # 而 setup-python 在该镜像上没有 3.9 的构建（会直接失败）。
    # 固定到 24.04 才能保留 3.9 的兼容性验证。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 语法检查
        run: python -m compileall -q api auth cache player ui main.py config.py tools tests

      - name: 代码风格
        run: ruff check .

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 模块导入冒烟测试
        run: |
          python -c "
          from api.client import NeteaseAPI
          from api.crypto import weapi_encrypt
          from auth.qrterm import make_matrix
          from cache.db import CacheDB
          from player.mpv_wrapper import MpvPlayer
          from player.queue import PlayQueue
          import ui.tui
          d = weapi_encrypt({'a': 1})
          assert d['params'] and len(d['encSecKey']) == 256, 'weapi 加密异常'
          print('模块导入与加密自检 OK')
          "
